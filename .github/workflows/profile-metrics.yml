name: Generate self-hosted profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate-profile-stats.mjs"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate local SVG metrics
        env:
          GITHUB_USER: gestao-quiroz
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node scripts/generate-profile-stats.mjs

      - name: Commit refreshed metrics
        run: |
          git config user.name "quiroz-metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/stats/*.svg
          if git diff --cached --quiet; then
            echo "No metric changes"
            exit 0
          fi
          git commit -m "chore: refresh profile metrics"
          git push
