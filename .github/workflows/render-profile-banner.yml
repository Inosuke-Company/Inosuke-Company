name: Render responsive profile banner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "banner.mp4"
      - ".github/workflows/render-profile-banner.yml"

permissions:
  contents: write

concurrency:
  group: profile-banner
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Render animated WebP from MP4
        shell: bash
        run: |
          set -euo pipefail
          ENCODER="libwebp"
          if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q "libwebp_anim"; then
            ENCODER="libwebp_anim"
          fi
          ffmpeg -y -i banner.mp4 \
            -vf "fps=10,scale='min(1200,iw)':-2:flags=lanczos" \
            -an -loop 0 -c:v "$ENCODER" -lossless 0 -compression_level 3 -q:v 68 \
            banner.webp
          test -s banner.webp

      - name: Render universal animated GIF fallback
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i banner.mp4 \
            -filter_complex "fps=8,scale='min(960,iw)':-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            -loop 0 banner-fallback.gif
          test -s banner-fallback.gif

      - name: Commit generated banner assets safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inosuke-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add banner.webp banner-fallback.gif
          if git diff --cached --quiet; then
            echo "Banner assets already up to date."
            exit 0
          fi
          git commit -m "Refresh responsive animated banner"
          git pull --rebase origin main
          git push origin main
