name: Align aggregate commit counter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-align-total.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Account for the visual refresh commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/render-profile-visuals.mjs')
          s = p.read_text()
          old = 'const totalCommits = CORE_COMMIT_FLOOR + profileCommits;'
          new = 'const totalCommits = CORE_COMMIT_FLOOR + profileCommits + 1;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected total commit expression not found')
          p.write_text(s)
          Path('.github/workflows/one-time-align-total.yml').unlink()
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "inosuke-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/render-profile-visuals.mjs .github/workflows/one-time-align-total.yml
          git commit -m "Keep aggregate commit counter exact"
          git pull --rebase origin main
          git push origin main
