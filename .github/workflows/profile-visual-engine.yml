name: Render Inosuke premium profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README.en.md"
      - "README.es.md"
      - "README.fr.md"
      - "scripts/render-profile-visuals.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/profile-visual-engine.yml"

permissions:
  contents: write

concurrency:
  group: inosuke-profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_USER: Inosuke-Company
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CORE_COMMIT_FLOOR: "704"

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned visual engine libraries
        run: npm ci --no-audit --no-fund

      - name: Render premium self-hosted visuals
        run: npm run profile:render

      - name: Remove superseded profile artwork
        shell: bash
        run: |
          rm -rf assets/inosuke
          rm -f assets/stats/beast-dashboard.svg
          rm -f assets/stats/contribution-current.svg
          rm -f assets/stats/breathing-heatmap.svg

      - name: Commit refreshed visual assets safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inosuke-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "Profile visuals already current."
            exit 0
          fi
          git commit -m "Refresh premium Inosuke profile visuals"
          git pull --rebase origin main
          git push origin main
