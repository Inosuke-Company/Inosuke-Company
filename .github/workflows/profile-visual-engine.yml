name: Render Inosuke profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/render-profile-visuals.mjs"
      - "package.json"
      - ".github/workflows/profile-visual-engine.yml"

permissions:
  contents: write

concurrency:
  group: inosuke-profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_USER: Inosuke-Company
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install visual engine libraries
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Render D3 + Iconify self-hosted visuals
        run: npm run profile:render

      - name: Commit refreshed visual assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/inosuke assets/stats
          if git diff --cached --quiet; then
            echo "Profile visuals already current."
            exit 0
          fi
          git commit -m "Refresh Inosuke profile visuals"
          git push
