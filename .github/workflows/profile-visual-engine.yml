# Renderizador premium auto-hospedado do perfil
name: Atualizar visuais premium do perfil Inosuke

on:
  workflow_dispatch:
  schedule:
    # Recalcula todos os repositórios uma vez por hora.
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README.en.md"
      - "README.es.md"
      - "README.fr.md"
      - "scripts/render-profile-visuals.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/profile-visual-engine.yml"

permissions:
  contents: write

concurrency:
  group: inosuke-profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_USER: Inosuke-Company
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      PRIVATE_COMMIT_BASELINE: "704"

    steps:
      - name: Baixar repositório do perfil
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar bibliotecas visuais
        run: npm install --no-audit --no-fund

      - name: Gerar visuais e métricas em português
        run: npm run profile:render

      - name: Publicar ativos atualizados com segurança
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inosuke-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets package-lock.json
          if git diff --cached --quiet; then
            echo "Os visuais do perfil já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar métricas e visuais do perfil"
          git pull --rebase origin main
          git push origin main
