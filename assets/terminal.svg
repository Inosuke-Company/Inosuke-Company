<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.33" stop-color="#7C3AED"/>
      <stop offset="0.66" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#00E5FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="356" rx="24" fill="url(#bg)" stroke="url(#stroke)" stroke-width="4"/>
  <rect x="25" y="25" width="1150" height="310" rx="18" fill="#05070F" stroke="#1F2937"/>
  <circle cx="58" cy="55" r="8" fill="#FF5F56"/>
  <circle cx="84" cy="55" r="8" fill="#FFBD2E"/>
  <circle cx="110" cy="55" r="8" fill="#27C93F"/>
  <text x="145" y="61" fill="#94A3B8" font-family="monospace" font-size="20">quiroz@fullstack:~/product-engineering</text>

  <text x="55" y="115" fill="#22D3EE" font-family="monospace" font-size="25">$ whoami</text>
  <text x="55" y="153" fill="#E2E8F0" font-family="monospace" font-size="25" opacity="0">Quiroz — Full Stack Developer &amp; Product Builder
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="55" y="205" fill="#22D3EE" font-family="monospace" font-size="25" opacity="0">$ current_focus
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="55" y="243" fill="#E2E8F0" font-family="monospace" font-size="25" opacity="0">Web • Android • iOS • SaaS • Cloud • Secure Systems
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.36;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="55" y="295" fill="#22D3EE" font-family="monospace" font-size="25" opacity="0">$ status
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.47;0.51;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="170" y="295" fill="#34D399" font-family="monospace" font-size="25" filter="url(#glow)" opacity="0">BUILDING REAL PRODUCTS █
    <animate attributeName="opacity" values="0;0;1;1;0.3;1" keyTimes="0;0.56;0.60;0.82;0.9;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
