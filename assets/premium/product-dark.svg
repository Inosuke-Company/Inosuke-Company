    <style>@media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}</style>
  </defs>
    <rect width="1200" height="350" rx="30" fill="#0b0d11"/><rect x="42" y="34" width="1116" height="282" rx="24" fill="#11151a" fill-opacity=".70" stroke="#2c323a" stroke-width=".7" filter="url(#m-shadow)"/>
    <text x="82" y="87" fill="#d67b4d" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="4.4">PRODUTO PRINCIPAL · CÓDIGO PROPRIETÁRIO</text>
