<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Meu Salão — produto principal"><defs>
    <linearGradient id="m-duo" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#93482c"/><stop offset=".27" stop-color="#f0b38a"/><stop offset=".5" stop-color="#d8dde3"/><stop offset=".73" stop-color="#b8cde7"/><stop offset="1" stop-color="#263f61"/></linearGradient>
    <linearGradient id="m-shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="m-halo"><stop stop-color="#f0b38a" stop-opacity=".18"/><stop offset=".48" stop-color="#b8cde7" stop-opacity=".09"/><stop offset="1" stop-color="#0b0d11" stop-opacity="0"/></radialGradient>
    <filter id="m-grain"><feTurbulence baseFrequency=".82" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .025 0"/></filter>
