<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Meu Salão product"><defs>
    <linearGradient id="m-duo" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7d3b24"/><stop offset=".27" stop-color="#e4aa82"/><stop offset=".5" stop-color="#dde1e6"/><stop offset=".73" stop-color="#88a7cf"/><stop offset="1" stop-color="#172b47"/></linearGradient>
    <linearGradient id="m-shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"><animate attributeName="offset" values=".82;1;.82" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="m-halo"><stop stop-color="#e4aa82" stop-opacity=".18"/><stop offset=".48" stop-color="#88a7cf" stop-opacity=".09"/><stop offset="1" stop-color="#f7f5f1" stop-opacity="0"/></radialGradient>
    <filter id="m-grain"><feTurbulence baseFrequency=".82" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .025 0"/></filter>
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}</style>
  </defs>
    <rect width="1200" height="350" rx="30" fill="#f7f5f1"/><rect x="42" y="34" width="1116" height="282" rx="24" fill="#fffdf9" fill-opacity=".95" stroke="#d9d3cb" stroke-width=".7" filter="url(#m-shadow)"/>
    <text x="82" y="87" fill="#b85f36" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="5">PRIVATE PRODUCT · LIVE DEMO</text>
    <text x="80" y="175" fill="#17191d" font-family="'Bodoni Moda','Playfair Display',Georgia,serif" font-size="73" font-weight="600">Meu Salão</text>
    <text x="83" y="216" fill="#70737a" font-family="'Helvetica Neue',Arial,sans-serif" font-size="17">Integrated management for beauty businesses.</text>
    <text x="83" y="248" fill="#70737a" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14">Scheduling · CRM · Finance · Inventory · Team · Analytics · Permissions</text>
