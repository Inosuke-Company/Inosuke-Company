    <text x="83" y="216" fill="#70737a" font-family="'Helvetica Neue',Arial,sans-serif" font-size="17">Plataforma integrada de gestão para negócios de beleza.</text>
    <text x="83" y="247" fill="#70737a" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15">Operação real · Web · Android · fundação iOS · evolução para SaaS comercial</text>
